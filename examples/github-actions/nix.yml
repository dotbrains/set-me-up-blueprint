name: nix blueprint

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: actions/checkout@v4
        with:
          repository: dotbrains/set-me-up-installer
          path: set-me-up-installer
      - run: python3 set-me-up-installer/smu.py blueprint ci --path . --check-docs --json
      - run: python3 set-me-up-installer/smu.py nix bootstrap --json
      - run: SMU_HOME_DIR="$PWD" python3 set-me-up-installer/smu.py provisioning-adapter preflight --adapter home-manager -m example --json || true
      - run: nix --extra-experimental-features 'nix-command flakes' flake check --no-build ./examples/nix-flake
