name: hybrid blueprint

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dotbrains/set-me-up-installer
          path: set-me-up-installer
      - run: mkdir -p /tmp/smu-home
      - run: SMU_HOME_DIR=/tmp/smu-home python3 set-me-up-installer/smu.py blueprint init --mode hybrid --force
      - run: SMU_HOME_DIR=/tmp/smu-home python3 set-me-up-installer/smu.py provisioning-adapter doctor --json
